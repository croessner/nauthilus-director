name: Run Unit Tests

on:
  push:
    branches:
      - main
      - features
      - release/**
  pull_request:
    branches:
      - main
      - features
      - release/**

permissions:
  contents: read

env:
  GOEXPERIMENT: runtimesecret

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.26.x

      - name: Enable Go modules and vendored dependencies
        run: |
          go env -w GO111MODULE=on
          go env -w GOFLAGS=-mod=vendor

      - name: Run unit tests
        run: make test
