---
name: Development Docker Build

"on":
  push:
    branches:
      - features

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      source_ref: ${{ github.sha }}
      fetch_depth: 0
      dockerfile_path: packaging/docker/Dockerfile
      tags: |
        ghcr.io/${{ github.repository_owner }}/nauthilus-director:dev
        ghcr.io/${{ github.repository_owner }}/nauthilus-director:features
      annotations: >-
        index,manifest:org.opencontainers.image.description=Production
        Nauthilus Director mail protocol proxy
      labels: |
        org.opencontainers.image.description=Production Nauthilus Director mail protocol proxy
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.version=dev
        io.nauthilus.director.build.reason=features-push

  build-client:
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      source_ref: ${{ github.sha }}
      fetch_depth: 0
      dockerfile_path: packaging/docker/Dockerfile.client
      tags: |
        ghcr.io/${{ github.repository_owner }}/nauthilus-directorctl:dev
        ghcr.io/${{ github.repository_owner }}/nauthilus-directorctl:features
      annotations: >-
        index,manifest:org.opencontainers.image.description=Nauthilus Director
        operator CLI, manpages and troubleshooting tools
      labels: |
        org.opencontainers.image.description=Nauthilus Director operator CLI, manpages and troubleshooting tools
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.version=dev
        io.nauthilus.director.build.reason=features-push
