        cluster:
            addresses:
                - 127.0.0.1:6379
            max_redirects: 8
            route_by_latency: false
            route_randomly: false
            route_reads_to_replicas: false
        database_number: 0
        dial_timeout: 5s
        enabled: true
        health:
            enabled: true
            failure_threshold: 3
            interval: 5s
            timeout: 2s
        key_prefix: 'nauthilus-director:'
        min_idle_connections: 4
        mode: standalone
        namespaces:
            affinity: 'affinity:'
            backend_runtime: 'runtime:backend:'
            sessions: 'sessions:'
            user_runtime: 'runtime:user:'
        pool_size: 20
        pool_timeout: 5s
        protocol: 3
        read_timeout: 2s
        retries:
            max_attempts: 3
            max_backoff: 1s
            min_backoff: 100ms
        schema_version: 1
        sentinel:
            addresses: []
            master_name: ""
            password_file: <redacted>
            username: ""
        standalone:
            address: 127.0.0.1:6379
        tls:
            ca_file: /etc/nauthilus-director/redis-ca.pem
            cert: /etc/nauthilus-director/redis-client.crt
            enabled: true
            insecure_skip_verify: false
            key: <redacted>
            min_tls_version: TLS1.2
            server_name: redis.example.org
        write_timeout: 2s
