    health:
        healthy_after: 2
        interval: 5s
        jitter: 500ms
        timeout: 3s
        unhealthy_after: 3
    listeners:
        imap:
            address: 127.0.0.1:10143
            authority: default
            authority_context:
                grpc_metadata: {}
                http_headers: {}
            backend_pool: imap-default
            imap:
                auth_mechanisms:
                    - plain
                    - xoauth2
                    - oauthbearer
                capabilities:
                    - IMAP4rev1
                    - ID
                    - SASL-IR
                    - STARTTLS
                    - AUTH=PLAIN
                    - AUTH=XOAUTH2
                    - AUTH=OAUTHBEARER
                require_id_before_auth: false
            network: tcp
            protocol: imap
            proxy_protocol:
                enabled: false
                trusted_cidrs: []
            service_name: imap
            tls:
                cert: /etc/nauthilus-director/imap.crt
                client_ca: ""
                key: <redacted>
                min_tls_version: TLS1.2
                mode: starttls
                require_client_cert: false
        imaps:
            address: 127.0.0.1:10993
            authority: default
            authority_context:
                grpc_metadata: {}
                http_headers: {}
            backend_pool: imap-default
            imap:
