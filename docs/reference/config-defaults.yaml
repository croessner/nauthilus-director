auth:
    authorities:
        default:
            grpc:
                address: 127.0.0.1:50051
                allow_plaintext_loopback: false
                authority: nauthilus.example.org
                caller_auth:
                    basic:
                        enabled: true
                        password_file: <redacted>
                        username: nauthilus-director
                    bearer:
                        enabled: false
                        token_file: <redacted>
                    oidc:
                        enabled: false
                tls:
                    ca_file: /etc/nauthilus-director/nauthilus-grpc-ca.pem
                    enabled: true
                    insecure_skip_verify: false
                    server_name: nauthilus.example.org
            http:
                allow_plaintext_loopback: true
                basic_auth:
                    password_file: <redacted>
                    username: nauthilus-director
                content_type: application/json
                endpoint: http://127.0.0.1:8080/api/v1/auth/json
                tls:
                    ca_file: /etc/nauthilus-director/nauthilus-http-ca.pem
                    enabled: false
                    insecure_skip_verify: false
                    server_name: nauthilus.example.org
            mechanisms:
                bearer:
                    enabled: true
                    introspection:
                        account_claim: ""
                        auth_method: client_secret_basic
                        client_assertion_alg: ""
                        client_id: nauthilus-director-sasl
                        client_key_id: ""
                        client_private_key_file: ""
                        client_secret: ""
                        client_secret_file: <redacted>
                        discovery_url: ""
                        enabled: true
                        issuer: https://auth.example.org
                        required_audience: nauthilus-director-sasl
                        required_resource: ""
                        required_scope: email
                    names:
                        - xoauth2
                        - oauthbearer
                    token_max_bytes: 16384
                    validation: nauthilus_introspection
                password:
                    enabled: true
                    names:
                        - plain
                        - login
            oidc:
                audience_hint: mail
                authority_mode: nauthilus
                client_credentials:
                    audience: ""
                    client_assertion_alg: ""
                    client_id: nauthilus-director
                    client_key_id: ""
                    client_private_key_file: ""
                    client_secret: ""
                    client_secret_file: <redacted>
                    enabled: true
                    introspection_endpoint_auth_method: client_secret_basic
                    refresh_before_expiry: 1m0s
                    scopes:
                        - nauthilus:authenticate
                        - nauthilus:lookup_identity
                        - nauthilus:list_accounts
                    token_endpoint: ""
                    token_endpoint_auth_method: client_secret_basic
                discovery_url: ""
                enabled: true
                issuer: https://auth.example.org
                issuer_hint: https://auth.example.org
            timeout: 5s
            transport: http
director:
    affinity:
        active_user_pinning:
            bind_to: shard_tag
            enabled: true
            failover:
                allow_on_hard_down: true
                allow_on_hard_maintenance: true
                audit: true
            idle_grace: 5m0s
            key:
                tenant: default
                user: normalized_username
            release: after_last_session_closed
            required_for:
                - imap
                - pop3
                - sieve
        backend_retention:
            default_ttl: 15m0s
            enabled: true
            max_ttl: 24h0m0s
        initial_placement: rendezvous_hash
        local_cache:
            enabled: true
            max_entries: 100000
            ttl: 15m0s
        mode: active_user_pin
        user_holds:
            enabled: true
            max_duration: 30m0s
            max_local_waiters: 1024
            max_local_waiters_per_user: 16
            max_wait: 30s
            poll_interval: 250ms
    backend_pools:
        imap-default:
            backends:
                - mailstore-a-imap
                - mailstore-b-imap
            protocol: imap
            selector: rendezvous_hash
        lmtp-default:
            backends:
                - mailstore-a-lmtp
                - mailstore-b-lmtp
            protocol: lmtp
            selector: recipient_hash
        pop3-default:
            backends:
                - mailstore-a-pop3
                - mailstore-b-pop3
            protocol: pop3
            selector: rendezvous_hash
        sieve-default:
            backends:
                - mailstore-a-sieve
                - mailstore-b-sieve
            protocol: sieve
            selector: rendezvous_hash
    backends:
        mailstore-a-imap:
            address: 127.0.0.1:1143
            auth:
                credential_replay:
                    allowed_mechanisms:
                        - plain
                        - login
                        - xoauth2
                        - oauthbearer
                    preserve_mechanism: true
                    require_backend_tls: true
                master_user:
                    mechanism: plain
                    password_file: <redacted>
                    user_format: '{user}*{master_user}'
                    username: nauthilus-director
                mode: master_user
                oauthbearer:
                    require_tls: false
                    token_file: ""
                sasl:
                    mechanism: ""
                    password_file: ""
                    require_tls: false
                    username: ""
            backend_node: mailstore-a-node-1
            haproxy:
                enabled: false
            health_check:
                deep_check: true
                enabled: true
                password_file: <redacted>
                username: healthcheck@example.org
            maintenance: disabled
            max_connections: 1000
            protocol: imap
            shard_tag: mailstore-a
            tls:
                ca_file: /etc/nauthilus-director/mailstore-ca.pem
                cert: ""
                insecure_skip_verify: false
                key: ""
                min_tls_version: TLS1.2
                mode: starttls
                server_name: mailstore-a.example.org
            weight: 100
        mailstore-a-lmtp:
            address: 127.0.0.1:2424
            auth:
                credential_replay:
                    allowed_mechanisms: []
                    preserve_mechanism: false
                    require_backend_tls: false
