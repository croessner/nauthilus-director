                mode: implicit
                require_client_cert: false
        lmtp:
            address: 127.0.0.1:10024
            authority: default
            authority_context:
                grpc_metadata: {}
                http_headers: {}
            backend_pool: lmtp-default
            lmtp:
                capabilities:
                    - SMTPUTF8
                    - 8BITMIME
                    - ENHANCEDSTATUSCODES
                    - CHUNKING
                    - PIPELINING
                    - SIZE
                    - STARTTLS
                    - AUTH PLAIN LOGIN XOAUTH2 OAUTHBEARER
                capability_filter:
                    deny: []
                client_auth:
                    authority: default
                    mechanisms:
                        - plain
                        - login
                        - xoauth2
                        - oauthbearer
                    mtls:
                        identity_source: subject_common_name
                        satisfies_required: false
                    required: true
