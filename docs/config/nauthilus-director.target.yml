# nauthilus-director target configuration.
#
# This file documents the intended production configuration shape. It follows
# the same broad grouping style as Nauthilus config_v2: runtime, observability,
# storage, auth, and one product-specific domain root. It is not a compatibility
# promise for the archived proof-of-concept config in poc/nauthilus-director.yml.
#
# OpenAPI is intentionally not configured here. Specs belong under docs/specs,
# while generators and guardrails belong to scripts and Makefile targets.
# Runtime config should only contain optional behavior controlled at runtime,
# not code-generation metadata.
#
# Scalar values may reference environment variables with Nauthilus-style
# placeholders such as "${NAUTHILUS_DIRECTOR_REDIS_PASSWORD_FILE}". Expansion is
# performed before typed validation; expanded secrets remain redacted by default.
#
# Stable paths cover runtime, observability, storage.redis, auth.authorities,
# protocol listeners, protocol backends, routing and affinity.
---
runtime:
  instance_name: "nauthilus-director-01"

  process:
    shutdown_timeout: 30s

  servers:
    control:
      enabled: true
      address: "127.0.0.1:9090"

      auth:
        bearer:
          enabled: true
          token_file: /etc/nauthilus-director/control-token
          # token_file may also be "${NAUTHILUS_DIRECTOR_CONTROL_TOKEN_FILE}".
        oidc:
          enabled: true
          authority: default
          validation: nauthilus
          required_scopes:
            - nauthilus-director.admin
          protected_scopes:
            - nauthilus-director.protected
        mtls:
          enabled: false

      tls:
        enabled: false
        cert: /etc/nauthilus-director/control.crt
        key: /etc/nauthilus-director/control.key
        client_ca: /etc/nauthilus-director/control-client-ca.pem
        require_client_cert: false
        min_tls_version: TLS1.2

  state:
    reaper:
      # Expired session and reservation repair must stay bounded per pass.
      interval: 5s
      batch_size: 100
      max_pass_duration: 2s
      jitter: 500ms

    indexes:
      # Repairable runtime indexes are sharded so control reads and reaper work
      # do not depend on one deployment-wide Redis object.
      session_shards: 64
      user_shards: 32
      backend_shards: 32
      page_default: 100
      page_max: 1000

    backend_reservations:
      # Reservations fail closed by temporarily consuming capacity if a
      # Director exits before releasing them; repair lets expired reservations
      # converge without deleting active production sessions implicitly.
      ttl: 30m
      repair_interval: 5s

  timeouts:
    preauth: 30s
    auth: 10s
    nauthilus: 5s
    backend_connect: 5s
    proxy_idle: 30m
    shutdown: 30s

  clients:
    http:
      max_connections_per_host: 20
      max_idle_connections: 20
      max_idle_connections_per_host: 10
      idle_connection_timeout: 30s

observability:
  log:
    level: "info"
    json: true
    add_source: false
    redact_secrets: true
    username_hash_salt_file: /etc/nauthilus-director/username-hash-salt

  metrics:
    enabled: true
    path: /metrics
    runtime_metrics: true

  tracing:
    enabled: true
    service_name: nauthilus-director
    exporter: otlp
    endpoint: "127.0.0.1:4317"
    sample_ratio: 0.1

  profiles:
    pprof:
      enabled: false
    block:
      enabled: false
    mutex:
      enabled: false
    goroutine:
      enabled: false

storage:
  redis:
    enabled: true
    protocol: 3
    mode: standalone
    key_prefix: "nauthilus-director:"
    schema_version: 1
    namespaces:
      affinity: "affinity:"
      sessions: "sessions:"
      backend_runtime: "runtime:backend:"
      user_runtime: "runtime:user:"

    standalone:
      address: "127.0.0.1:6379"

    cluster:
      addresses:
        - "127.0.0.1:6379"
      max_redirects: 8
      read_only: false
      route_by_latency: false
      route_randomly: false

    sentinel:
      master_name: ""
      addresses: []
      username: ""
      password_file: /etc/nauthilus-director/redis-sentinel-password

    auth:
      username: nauthilus-director
      password_file: /etc/nauthilus-director/redis-password
      # password_file may also be "${NAUTHILUS_DIRECTOR_REDIS_PASSWORD_FILE}".

    database_number: 0

    tls:
      enabled: true
      ca_file: /etc/nauthilus-director/redis-ca.pem
      cert: /etc/nauthilus-director/redis-client.crt
      key: /etc/nauthilus-director/redis-client.key
      server_name: redis.example.org
      min_tls_version: TLS1.2
      insecure_skip_verify: false

    pool_size: 20
    min_idle_connections: 4
    pool_timeout: 5s
    dial_timeout: 5s
    read_timeout: 2s
    write_timeout: 2s

    retries:
      max_attempts: 3
      min_backoff: 100ms
      max_backoff: 1s

    health:
      enabled: true
      interval: 5s
      timeout: 2s
      failure_threshold: 3

auth:
  authorities:
    default:
      transport: http
      timeout: 5s

      mechanisms:
        password:
          enabled: true
          names:
            - plain
            - login
        bearer:
          # This subtree validates incoming mail SASL end-user bearer tokens.
          # It is separate from oidc.client_credentials below.
          enabled: true
          names:
            - xoauth2
            - oauthbearer
          validation: nauthilus_introspection
          token_max_bytes: 16384
          introspection:
            enabled: true
            # Configure either issuer or discovery_url. Discovery must expose
            # an introspection_endpoint before bearer-capable listeners start.
            issuer: https://auth.example.org
            discovery_url: ""
            client_id: nauthilus-director-sasl
            client_secret: ""
            client_secret_file: /etc/nauthilus-director/nauthilus-introspection-client-secret
            auth_method: client_secret_basic
            # For private_key_jwt, clear client_secret/client_secret_file and
            # configure the mounted private key file:
            # auth_method: private_key_jwt
            # client_private_key_file: /etc/nauthilus-director/nauthilus-introspection-client-key.pem
            # client_key_id: director-sasl-key-1
            # client_assertion_alg: RS256
            client_private_key_file: ""
            client_key_id: ""
            client_assertion_alg: ""
            # required_scope applies to the introspected end-user token.
            # It is not the Director caller-token scope list.
            required_scope: email
            # Leave empty to use the conservative default account-claim chain,
            # or set one non-secret claim name expected from Nauthilus.
            account_claim: ""

      oidc:
        # This subtree is Director-to-Nauthilus caller auth. It obtains the
        # Director's own backchannel token for HTTP/gRPC authority calls.
        enabled: true
        authority_mode: nauthilus
        issuer_hint: https://auth.example.org
        issuer: https://auth.example.org
        discovery_url: ""
        audience_hint: mail
        client_credentials:
          enabled: true
          client_id: nauthilus-director
          client_secret: ""
          client_secret_file: /etc/nauthilus-director/nauthilus-oidc-client-secret
          token_endpoint_auth_method: client_secret_basic
          # This controls endpoint auth for control-plane OIDC token introspection
          # through this authority, not mail SASL bearer introspection.
          # Mail SASL uses mechanisms.bearer.introspection.auth_method.
          introspection_endpoint_auth_method: client_secret_basic
          # For Nauthilus private_key_jwt caller auth, set token endpoint auth
          # and, for control-plane OIDC introspection, introspection auth:
          # token_endpoint_auth_method: private_key_jwt
          # introspection_endpoint_auth_method: private_key_jwt
          # client_private_key_file: /etc/nauthilus-director/nauthilus-oidc-client-key.pem
          # client_key_id: director-key-1
          # client_assertion_alg: RS256
          # audience: https://auth.example.org/oidc/token
          client_private_key_file: ""
          client_key_id: ""
          client_assertion_alg: RS256
          audience: ""
          # These are requested for the Director caller token only. They are
          # not required end-user token scopes for mail SASL bearer auth.
          scopes:
            - nauthilus:authenticate
            - nauthilus:lookup_identity
            - nauthilus:list_accounts
          refresh_before_expiry: 1m
          token_endpoint: ""

      http:
        endpoint: "http://127.0.0.1:8080/api/v1/auth/json"
        content_type: application/json
        basic_auth:
          username: nauthilus-director
          password_file: /etc/nauthilus-director/nauthilus-http-password
        tls:
          enabled: false
          ca_file: /etc/nauthilus-director/nauthilus-http-ca.pem
          server_name: nauthilus.example.org
          insecure_skip_verify: false

      grpc:
        address: "127.0.0.1:50051"
        authority: nauthilus.example.org
        caller_auth:
          basic:
            enabled: true
            username: nauthilus-director
            password_file: /etc/nauthilus-director/nauthilus-grpc-password
          bearer:
            enabled: false
            token_file: /etc/nauthilus-director/nauthilus-grpc-token
          oidc:
            enabled: false
        tls:
          enabled: true
          ca_file: /etc/nauthilus-director/nauthilus-grpc-ca.pem
          server_name: nauthilus.example.org
          insecure_skip_verify: false

director:
  security:
    fail_closed: true
    max_preauth_line_bytes: 8192
    max_preauth_literal_bytes: 65536

  listeners:
    imap:
      protocol: imap
      service_name: imap
      network: tcp
      address: "127.0.0.1:10143"
      authority: default
      backend_pool: imap-default

      # Optional static listener authority context adds deployment facts to
      # outbound Nauthilus authority requests. Nauthilus consumes these values
      # only through explicit auth.policy.request_headers and
      # auth.policy.request_metadata allowlists. They are not routing hints,
      # backend selectors, user identity, dynamic claims or secrets.
      authority_context:
        http_headers:
          X-Deployment-Realm: public-mail
        grpc_metadata:
          x-deployment-realm: public-mail

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: starttls
        cert: /etc/nauthilus-director/imap.crt
        key: /etc/nauthilus-director/imap.key
        client_ca: ""
        require_client_cert: false
        min_tls_version: TLS1.2

      imap:
        capabilities:
          - IMAP4rev1
          - ID
          - SASL-IR
          - STARTTLS
          - AUTH=PLAIN
          - AUTH=XOAUTH2
          - AUTH=OAUTHBEARER
        auth_mechanisms:
          - plain
          - xoauth2
          - oauthbearer
        require_id_before_auth: false

    imaps:
      protocol: imap
      service_name: imaps
      network: tcp
      address: "127.0.0.1:10993"
      authority: default
      backend_pool: imap-default

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: implicit
        cert: /etc/nauthilus-director/imaps.crt
        key: /etc/nauthilus-director/imaps.key
        client_ca: ""
        require_client_cert: false
        min_tls_version: TLS1.2

      imap:
        capabilities:
          - IMAP4rev1
          - ID
          - SASL-IR
          - AUTH=PLAIN
          - AUTH=XOAUTH2
          - AUTH=OAUTHBEARER
        auth_mechanisms:
          - plain
          - xoauth2
          - oauthbearer
        require_id_before_auth: false

    lmtp:
      protocol: lmtp
      service_name: lmtp
      network: tcp
      address: "127.0.0.1:10024"
      authority: default
      backend_pool: lmtp-default

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: starttls
        cert: /etc/nauthilus-director/lmtp.crt
        key: /etc/nauthilus-director/lmtp.key
        client_ca: /etc/nauthilus-director/lmtp-client-ca.pem
        require_client_cert: false
        min_tls_version: TLS1.2

      lmtp:
        client_auth:
          # Client auth verifies the submitting LMTP peer. This block controls
          # SASL peer auth with technical submitter credentials checked by
          # Nauthilus, not recipient mailbox user credentials. Mutual TLS is
          # configured through the listener tls client certificate settings.
          required: true
          authority: default
          mechanisms:
            - plain
            - login
            - xoauth2
            - oauthbearer
          mtls:
            satisfies_required: false
            identity_source: subject_common_name
        size:
          # Listener-owned frontend SIZE policy. SIZE can be advertised only
          # when this value is positive, SIZE is listed below, the deny filter
          # permits it and every eligible backend has fresh SIZE proof. The
          # advertised effective max is the lower of this value and the
          # backend-pool proof. DATA and BDAT enforce the effective max.
          max_message_bytes: 0
        capabilities:
          # Capabilities are the desired listener surface. Runtime advertisement
          # is mediated by implemented command support, TLS state, auth policy
          # and backend-pool capabilities. Omitted extensions are deny rules:
          # their frontend commands or MAIL parameters fail closed.
          #
          # CHUNKING controls frontend BDAT availability; selected backend
          # CHUNKING is evaluated separately and may enable backend BDAT
          # delivery for frontend DATA or BDAT. 8BITMIME requires
          # BODY=8BITMIME parsing and backend-safe forwarding. SIZE accepts
          # MAIL FROM SIZE=<n> only after current-session advertisement and
          # forwards the accepted declaration only to a selected backend that
          # advertised SIZE. PIPELINING is a frontend ordered-reply contract and
          # does not enable backend command batching.
          - SMTPUTF8
          - ENHANCEDSTATUSCODES
          - CHUNKING
          # - 8BITMIME
          # - SIZE
          # - PIPELINING
          - STARTTLS
          - AUTH PLAIN LOGIN XOAUTH2 OAUTHBEARER
        capability_filter:
          # Hard-denied capabilities are never advertised and are not consumed
          # from backend capability proof for this listener. Deny whole
          # capability names only. This overrides fresh backend proof and
          # selected-backend LHLO discovery; disable BDAT through CHUNKING.
          deny: []

    lmtps:
      protocol: lmtp
      service_name: lmtps
      network: tcp
      address: "127.0.0.1:11024"
      authority: default
      backend_pool: lmtp-default

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: implicit
        cert: /etc/nauthilus-director/lmtps.crt
        key: /etc/nauthilus-director/lmtps.key
        client_ca: ""
        require_client_cert: false
        min_tls_version: TLS1.2

      lmtp:
        client_auth:
          # Client auth verifies the submitting LMTP peer. This block controls
          # SASL peer auth with technical submitter credentials checked by
          # Nauthilus, not recipient mailbox user credentials. Mutual TLS is
          # configured through the listener tls client certificate settings.
          required: true
          authority: default
          mechanisms:
            - plain
            - login
            - xoauth2
            - oauthbearer
          mtls:
            satisfies_required: false
            identity_source: subject_common_name
        size:
          # Listener-owned frontend SIZE policy. SIZE can be advertised only
          # when this value is positive, SIZE is listed below, the deny filter
          # permits it and every eligible backend has fresh SIZE proof. The
          # advertised effective max is the lower of this value and the
          # backend-pool proof. DATA and BDAT enforce the effective max.
          max_message_bytes: 0
        capabilities:
          # Capabilities are the desired listener surface. Runtime advertisement
          # is mediated by implemented command support, TLS state, auth policy
          # and backend-pool capabilities. Omitted extensions are deny rules:
          # their frontend commands or MAIL parameters fail closed.
          #
          # CHUNKING controls frontend BDAT availability; selected backend
          # CHUNKING is evaluated separately and may enable backend BDAT
          # delivery for frontend DATA or BDAT. 8BITMIME requires
          # BODY=8BITMIME parsing and backend-safe forwarding. SIZE accepts
          # MAIL FROM SIZE=<n> only after current-session advertisement and
          # forwards the accepted declaration only to a selected backend that
          # advertised SIZE. PIPELINING is a frontend ordered-reply contract and
          # does not enable backend command batching.
          - SMTPUTF8
          - ENHANCEDSTATUSCODES
          - CHUNKING
          # - 8BITMIME
          # - SIZE
          # - PIPELINING
          - AUTH PLAIN LOGIN XOAUTH2 OAUTHBEARER
        capability_filter:
          # Hard-denied capabilities are never advertised and are not consumed
          # from backend capability proof for this listener. Deny whole
          # capability names only. This overrides fresh backend proof and
          # selected-backend LHLO discovery; disable BDAT through CHUNKING.
          deny: []

    sieve:
      protocol: sieve
      service_name: sieve
      network: tcp
      address: "127.0.0.1:14190"
      authority: default
      backend_pool: sieve-default

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: starttls
        cert: /etc/nauthilus-director/sieve.crt
        key: /etc/nauthilus-director/sieve.key
        client_ca: ""
        require_client_cert: false
        min_tls_version: TLS1.2

      sieve:
        auth_mechanisms:
          - plain
          - xoauth2
          - oauthbearer
        capabilities:
          # Operator-controlled capability facts are typed policy inputs. RFC
          # 5804 IMPLEMENTATION and VERSION are internal protocol facts derived
          # from the binary version and RFC compliance level.
          script_extensions: []
          language: en

    sieves:
      protocol: sieve
      service_name: sieves
      network: tcp
      address: "127.0.0.1:14490"
      authority: default
      backend_pool: sieve-default

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: implicit
        cert: /etc/nauthilus-director/sieves.crt
        key: /etc/nauthilus-director/sieves.key
        client_ca: ""
        require_client_cert: false
        min_tls_version: TLS1.2

      sieve:
        auth_mechanisms:
          - plain
          - xoauth2
          - oauthbearer
        capabilities:
          # The implicit TLS listener uses the same typed capability policy;
          # runtime rendering can expose credential-bearing SASL only after TLS
          # is already active on the frontend connection.
          script_extensions: []
          language: en

    pop3:
      protocol: pop3
      service_name: pop3
      network: tcp
      address: "127.0.0.1:10110"
      authority: default
      backend_pool: pop3-default

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: starttls
        cert: /etc/nauthilus-director/pop3.crt
        key: /etc/nauthilus-director/pop3.key
        client_ca: ""
        require_client_cert: false
        min_tls_version: TLS1.2

      pop3:
        auth_mechanisms:
          - userpass
          - xoauth2
          - oauthbearer
        capabilities:
          # CAPA entries are bounded policy tokens. SASL mechanism content is
          # derived from auth_mechanisms and TLS state by the POP3 renderer.
          - STLS
          - USER
          - SASL

    pop3s:
      protocol: pop3
      service_name: pop3s
      network: tcp
      address: "127.0.0.1:10995"
      authority: default
      backend_pool: pop3-default

      proxy_protocol:
        enabled: false
        trusted_cidrs: []

      tls:
        mode: implicit
        cert: /etc/nauthilus-director/pop3s.crt
        key: /etc/nauthilus-director/pop3s.key
        client_ca: ""
        require_client_cert: false
        min_tls_version: TLS1.2

      pop3:
        auth_mechanisms:
          - userpass
          - xoauth2
          - oauthbearer
        capabilities:
          # The implicit TLS listener does not advertise STLS; credential
          # methods are already protected when the frontend connection exists.
          - USER
          - SASL

  routing:
    default_selector: rendezvous_hash
    default_shard: default
    hash_key: username
    lmtp_hash_key: recipient
    auth_attributes:
      tenant: tenant
      shard_tag: mailShard
    failover:
      enabled: true
      strategy: same_shard_then_any_healthy

  affinity:
    mode: active_user_pin
    initial_placement: rendezvous_hash

    active_user_pinning:
      enabled: true
      bind_to: shard_tag
      release: after_last_session_closed
      idle_grace: 5m
      required_for:
        - imap
        - pop3
        - sieve
      key:
        user: normalized_username
        tenant: default
      failover:
        allow_on_hard_down: true
        allow_on_hard_maintenance: true
        audit: true

    backend_retention:
      # Retained backend-node affinity protects mailbox index convergence after
      # the final visible session or delivery hold closes.
      enabled: true
      default_ttl: 15m
      max_ttl: 24h

    local_cache:
      enabled: true
      ttl: 15m
      max_entries: 100000

    user_holds:
      enabled: true
      max_duration: 30m
      max_wait: 30s
      poll_interval: 250ms
      max_local_waiters: 1024
      max_local_waiters_per_user: 16

  runtime_overrides:
    enabled: true
    config_writable: false
    backends:
      allow_weight_override: true
      allow_in_out: true
      allow_drain: true
      min_weight: 0
      max_weight: 10000
    users:
      allow_move: true
      allow_kick: true
      allow_affinity_clear: true
      move_strategies:
        - new_sessions_only
        - kick_existing
        - drain_existing

  health:
    interval: 5s
    timeout: 3s
    jitter: 500ms
    unhealthy_after: 3
    healthy_after: 2

  maintenance:
    default_mode: disabled
    drain_timeout: 5m
    hard_kill_grace: 30s
    soft_allows_active_pins: true
    audit: true

  backend_pools:
    imap-default:
      protocol: imap
      selector: rendezvous_hash
      backends:
        - mailstore-a-imap
        - mailstore-b-imap

    lmtp-default:
      protocol: lmtp
      selector: recipient_hash
      backends:
        - mailstore-a-lmtp
        - mailstore-b-lmtp

    sieve-default:
      protocol: sieve
      selector: rendezvous_hash
      backends:
        - mailstore-a-sieve
        - mailstore-b-sieve

    pop3-default:
      protocol: pop3
      selector: rendezvous_hash
      backends:
        - mailstore-a-pop3
        - mailstore-b-pop3

  backends:
    mailstore-a-imap:
      protocol: imap
      shard_tag: mailstore-a
      backend_node: mailstore-a-node-1
      address: "127.0.0.1:1143"
      weight: 100
      max_connections: 1000
      maintenance: disabled

      # Backend-side PROXY protocol is per protocol endpoint. When enabled,
      # sessions and health checks write one PROXY preface before backend TLS
      # or greeting reads. backend_node remains the mailbox-authority identity,
      # not a proxy endpoint name.
      haproxy:
        enabled: false

      tls:
        mode: starttls
        ca_file: /etc/nauthilus-director/mailstore-ca.pem
        # Used for TLS SNI and certificate hostname verification.
        server_name: mailstore-a.example.org
        insecure_skip_verify: false

      auth:
        mode: master_user # master_user or credential_replay
        master_user:
          username: nauthilus-director
          password_file: /etc/nauthilus-director/backend-master-password
          user_format: "{user}*{master_user}"
          mechanism: plain
        credential_replay:
          require_backend_tls: true
          preserve_mechanism: true
          allowed_mechanisms:
            - plain
            - login
            - xoauth2
            - oauthbearer

      health_check:
        enabled: true
        deep_check: true
        username: healthcheck@example.org
        password_file: /etc/nauthilus-director/mailstore-health-password

    mailstore-b-imap:
      protocol: imap
      shard_tag: mailstore-b
      backend_node: mailstore-b-node-1
      address: "127.0.0.1:2143"
      weight: 100
      max_connections: 1000
      maintenance: disabled

      haproxy:
        enabled: false

      tls:
        mode: starttls
        ca_file: /etc/nauthilus-director/mailstore-ca.pem
        server_name: mailstore-b.example.org
        insecure_skip_verify: false

      auth:
        mode: master_user
        master_user:
          username: nauthilus-director
          password_file: /etc/nauthilus-director/backend-master-password
          user_format: "{user}*{master_user}"
          mechanism: plain
        credential_replay:
          require_backend_tls: true
          preserve_mechanism: true
          allowed_mechanisms:
            - plain
            - login
            - xoauth2
            - oauthbearer

      health_check:
        enabled: true
        deep_check: true
        username: healthcheck@example.org
        password_file: /etc/nauthilus-director/mailstore-health-password

    mailstore-a-lmtp:
      protocol: lmtp
      shard_tag: mailstore-a
      backend_node: mailstore-a-node-1
      address: "127.0.0.1:2424"
      weight: 100
      max_connections: 1000
      maintenance: disabled

      haproxy:
        enabled: false

      # Auth-free plaintext LMTP backend hops are valid only when this hop sends
      # no credentials. For a trusted internal delivery network, set tls.mode to
      # plaintext, disabled, or none together with auth.mode: none. SASL and
      # OAuth bearer keep require_tls: true by default and reject plaintext
      # unless an operator explicitly accepts the weaker require_tls: false
      # policy. mTLS always requires verified backend TLS plus client cert/key.
      tls:
        mode: implicit
        ca_file: /etc/nauthilus-director/mailstore-ca.pem
        cert: /etc/nauthilus-director/lmtp-backend-client.crt
        key: /etc/nauthilus-director/lmtp-backend-client.key
        server_name: mailstore-a.example.org
        min_tls_version: TLS1.2
        insecure_skip_verify: false

      auth:
        mode: sasl # none, mtls, sasl, oauthbearer
        sasl:
          mechanism: plain
          username: nauthilus-director-lmtp
          password_file: /etc/nauthilus-director/lmtp-backend-password
          require_tls: true
        oauthbearer:
          token_file: /etc/nauthilus-director/lmtp-backend-token
          require_tls: true

      health_check:
        enabled: true
        deep_check: true
        username: healthcheck@example.org
        password_file: /etc/nauthilus-director/mailstore-health-password

