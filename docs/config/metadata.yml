paths:
  runtime.**:
    stability: stable
    description: Runtime process identity, control listener, timeout, and client behavior.
  runtime.state.**:
    stability: stable
    description: Bounded Redis runtime-state indexes, pagination limits, and due-time reaper behavior.
  runtime.state.backend_reservations.**:
    stability: stable
    description: Backend capacity reservation lease and repair timing for Redis runtime state.
  observability.**:
    stability: stable
    description: Logging, metrics, tracing, and local diagnostic profile settings.
  storage.redis.**:
    stability: stable
    description: Central Redis connectivity, security, namespace, retry, and health settings.
  auth.authorities.**:
    stability: stable
    description: Nauthilus authentication authority transport and mechanism configuration.
  auth.authorities.*.mechanisms.bearer.introspection.**:
    stability: stable
    description: Mail SASL bearer-token introspection policy and endpoint client-auth material.
  auth.authorities.*.oidc.client_credentials.introspection_endpoint_auth_method:
    stability: stable
    description: Endpoint client-auth method used when control-plane OIDC validation introspects operator tokens with this authority; mail SASL bearer introspection uses mechanisms.bearer.introspection.auth_method.
  auth.authorities.*.oidc.client_credentials.scopes:
    stability: stable
    description: Director-to-Nauthilus caller-token request scopes only; mail SASL bearer required end-user token scope uses mechanisms.bearer.introspection.required_scope.
  auth.authorities.*.oidc.client_credentials.**:
    stability: stable
    description: Director-to-Nauthilus OIDC client-credentials caller authentication.
  director.security.**:
    stability: stable
    description: Director fail-closed and protocol input safety limits.
  director.listeners.**:
    stability: stable
    description: Public protocol listener, TLS, proxy protocol, authority, and backend-pool binding.
  director.listeners.*.authority_context.http_headers:
    stability: stable
    description: Static non-secret HTTP authority context facts consumed by Nauthilus only through explicit auth.policy.request_headers allowlists.
  director.listeners.*.authority_context.grpc_metadata:
    stability: stable
    description: Static non-secret gRPC authority context facts consumed by Nauthilus only through explicit auth.policy.request_metadata allowlists.
  director.routing.**:
    stability: stable
    description: Director-owned routing selector, shard default, hash-key, and failover behavior.
  director.affinity.**:
    stability: stable
    description: Active and retained backend-node affinity, placement holds, pinning, failover, and local-cache behavior.
  director.runtime_overrides.**:
    stability: stable
    description: Operator-controlled runtime override permissions and safety envelopes.
  director.health.**:
    stability: stable
    description: Backend health timing, jitter, and transition threshold settings.
  director.maintenance.**:
    stability: stable
    description: Static and runtime maintenance defaults, drain timing, and audit settings.
  director.backend_pools.**:
    stability: stable
    description: Backend pool protocol, selector, and member backend configuration.
  director.backends.**:
    stability: stable
    description: Backend protocol, shard, backend-node identity, transport, authentication, health, and runtime baseline settings.
