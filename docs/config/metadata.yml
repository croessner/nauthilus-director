paths:
  runtime.**:
    stability: stable
    description: Runtime process identity, control listener, timeout, and client behavior.
  runtime.state.**:
    stability: stable
    description: Bounded Redis runtime-state indexes, pagination limits, and due-time reaper behavior.
  runtime.state.backend_reservations.**:
    stability: stable
    description: Backend capacity reservation lease and repair timing for Redis runtime state.
  observability.**:
    stability: stable
    description: Logging, metrics, tracing, and local diagnostic profile settings.
  storage.redis.**:
    stability: stable
    description: Central Redis connectivity, security, namespace, retry, and health settings.
  auth.authorities.**:
    stability: stable
    description: Nauthilus authentication authority transport and mechanism configuration.
  auth.authorities.*.mechanisms.bearer.introspection.**:
    stability: stable
    description: Mail SASL bearer-token introspection policy and endpoint client-auth material.
  auth.authorities.*.oidc.client_credentials.introspection_endpoint_auth_method:
    stability: stable
    description: Endpoint client-auth method used when control-plane OIDC validation introspects operator tokens with this authority; mail SASL bearer introspection uses mechanisms.bearer.introspection.auth_method.
  auth.authorities.*.oidc.client_credentials.scopes:
    stability: stable
    description: Director-to-Nauthilus caller-token request scopes only; mail SASL bearer required end-user token scope uses mechanisms.bearer.introspection.required_scope.
  auth.authorities.*.oidc.client_credentials.**:
    stability: stable
    description: Director-to-Nauthilus OIDC client-credentials caller authentication.
  director.security.**:
    stability: stable
    description: Director fail-closed and protocol input safety limits.
  director.listeners.**:
    stability: stable
    description: Public protocol listener, TLS, proxy protocol, authority, and backend-pool binding.
  director.listeners.*.*.greeting.**:
    stability: stable
    description: Per-listener protocol greeting policy. display_name is a bounded public identity; software_version accepts default, include, or suppress and never permits raw transcript lines.
  director.listeners.*.lmtp.capabilities:
    stability: stable
    description: Positive LMTP frontend capability allowlist. STARTTLS and AUTH are mediated by listener TLS and auth policy; CHUNKING, 8BITMIME and SIZE are advertised only when configured, implemented, allowed by capability_filter.deny, and backed by fresh backend-pool capability proof. PIPELINING is frontend-only and never enables backend command batching.
  director.listeners.*.lmtp.capability_filter.deny:
    stability: stable
    description: Listener-scoped hard deny for whole LMTP capability names. Denied capabilities are not advertised and are not consumed from backend-pool or selected-backend capability proof for this listener.
  director.listeners.*.lmtp.size.max_message_bytes:
    stability: stable
    description: Listener-owned fixed frontend LMTP message-size policy. A positive value is required before SIZE can be configured and advertised; DATA and BDAT enforce the effective maximum, and accepted MAIL FROM SIZE declarations are forwarded only to selected backends that advertised SIZE.
  director.listeners.*.authority_context.http_headers:
    stability: stable
    description: Static non-secret HTTP authority context facts consumed by Nauthilus only through explicit auth.policy.request_headers allowlists.
  director.listeners.*.authority_context.grpc_metadata:
    stability: stable
    description: Static non-secret gRPC authority context facts consumed by Nauthilus only through explicit auth.policy.request_metadata allowlists.
  director.routing.**:
    stability: stable
    description: Director-owned routing selector, shard default, hash-key, and failover behavior.
  director.affinity.**:
    stability: stable
    description: Active and retained backend-node affinity, placement holds, pinning, failover, and local-cache behavior.
  director.runtime_overrides.**:
    stability: stable
    description: Operator-controlled runtime override permissions and safety envelopes.
  director.health.**:
    stability: stable
    description: Backend health timing, jitter, and transition threshold settings.
  director.maintenance.**:
    stability: stable
    description: Static and runtime maintenance defaults, drain timing, and audit settings.
  director.backend_pools.**:
    stability: stable
    description: Backend pool protocol, selector, and member backend configuration.
  director.backends.**:
    stability: stable
    description: Backend protocol, shard, backend-node identity, transport, authentication, health, and runtime baseline settings.
  director.backends.mailstore-a-lmtp.tls.**:
    stability: stable
    description: Backend transport TLS policy. LMTP accepts disabled, none, plaintext, starttls, and implicit; plaintext is for trusted internal hops and must not carry credentials unless auth policy explicitly permits it.
  director.backends.mailstore-a-lmtp.auth.**:
    stability: stable
    description: Protocol-specific backend authentication policy. LMTP auth.mode none sends no credentials over plaintext; SASL and OAuth bearer require verified backend TLS by default, while mTLS requires verified TLS plus client certificate material.
  director.backends.mailstore-a-lmtp.health_check.**:
    stability: stable
    description: Backend health-check credentials and depth. LMTP health checks reuse the same backend TLS and auth policy as sessions before stopping short of envelope or message-body commands.
  director.backends.mailstore-b-lmtp.tls.**:
    stability: stable
    description: Backend transport TLS policy. LMTP accepts disabled, none, plaintext, starttls, and implicit; plaintext is for trusted internal hops and must not carry credentials unless auth policy explicitly permits it.
  director.backends.mailstore-b-lmtp.auth.**:
    stability: stable
    description: Protocol-specific backend authentication policy. LMTP auth.mode none sends no credentials over plaintext; SASL and OAuth bearer require verified backend TLS by default, while mTLS requires verified TLS plus client certificate material.
  director.backends.mailstore-b-lmtp.health_check.**:
    stability: stable
    description: Backend health-check credentials and depth. LMTP health checks reuse the same backend TLS and auth policy as sessions before stopping short of envelope or message-body commands.
