runtime:
  instance_name: "${NAUTHILUS_INSTANCE_NAME}"
  servers:
    http:
      address: "0.0.0.0:8080"
      http3: false
    grpc:
      authority:
        enabled: true
        address: "0.0.0.0:50051"
        tls:
          enabled: true
          cert: /run/nauthilus-demo/grpc-tls/server.crt
          key: /run/nauthilus-demo/grpc-tls/server.key
          client_ca: ""
          require_client_cert: false
          min_tls_version: TLS1.2

observability:
  log:
    level: info
    json: true
    add_source: false
    debug_modules: []

identity:
  frontend:
    enabled: true
    encryption_secret: "directorDemoFrontendSecret2026!"
    assets:
      html_static_content_path: "/usr/app/static/templates"
      language_resources: "/usr/app/server/resources"
    localization:
      languages: [en]
      default_language: "en"

  mfa:
    totp:
      issuer: "Nauthilus Director Demo"
      skew: 1
    webauthn:
      rp_display_name: "Nauthilus Director Demo"
      rp_id: "demo.local"
      rp_origins:
        - "https://nauthilus-haproxy:8443"
      resident_key: "discouraged"
      user_verification: "preferred"

  oidc:
    enabled: true
    issuer: "https://nauthilus-haproxy:8443"
    access_token_type: "opaque"
    response_types_supported: [code]
    subject_types_supported: [public]
    id_token_signing_alg_values_supported: [RS256]
    token_endpoint_auth_methods_supported:
      - client_secret_basic
      - client_secret_post
    code_challenge_methods_supported: [S256]
    scopes_supported:
      - openid
      - nauthilus:authenticate
      - nauthilus:lookup_identity
      - nauthilus:list_accounts
    claims_supported:
      - sub
      - client_id
      - scope
    tokens:
      default_access_token_lifetime: 5m
      default_refresh_token_lifetime: 30m
    signing_keys:
      - id: "director-demo-rs256"
        key_file: "/run/nauthilus-demo/grpc-tls/oidc-signing.key"
        algorithm: "RS256"
        active: true
    clients:
      - name: "Nauthilus Director Demo"
        client_id: "nauthilus-director-demo"
        client_secret: "${DIRECTOR_OIDC_CLIENT_SECRET}"
        grant_types:
          - client_credentials
        token_endpoint_auth_method: "client_secret_basic"
        access_token_type: "opaque"
        access_token_lifetime: 5m
        scopes:
          - nauthilus:authenticate
          - nauthilus:lookup_identity
          - nauthilus:list_accounts

storage:
  redis:
    primary:
      address: "valkey:6379"
    database_number: 1
    prefix: "nauthilus:"
    pool_size: 16
    idle_pool_size: 4
    positive_cache_ttl: 1h
    negative_cache_ttl: 15m
    password_nonce: "demo-password-nonce-2026"
    encryption_secret: "demo-encryption-secret-2026"

auth:
  backchannel:
    basic_auth:
      enabled: false
      username: director
      password: director-api-secret
    oidc_bearer:
      enabled: true

  pipeline:
    max_concurrent_requests: 64
    max_login_attempts: 1
    local_cache_ttl: 5m

  backends:
    order:
      - cache
      - ldap

    ldap:
      default:
        server_uri:
          - "ldap://openldap:389"
        bind_dn: "cn=admin,dc=demo,dc=local"
        bind_pw: "admin"
        lookup_pool_size: 5
        lookup_idle_pool_size: 2
        auth_pool_size: 5
        auth_idle_pool_size: 2

      search:
        - protocol:
            - imap
            - lmtp
            - pop3
            - sieve
          cache_name: ldap
          base_dn: "ou=people,dc=demo,dc=local"
          filter:
            user: "(|(mail=%s)(uid=%s))"
            list_accounts: "(mail=*)"
          mapping:
            account_field: mail
            display_name_field: cn
            unique_user_id_field: uid
          attribute:
            - uid
            - cn
            - mail
            - mailShard

  policy:
    attribute_sources:
      lua:
        environment:
          - name: director_context
            script_path: /etc/nauthilus/lua/environment/director_context.lua
